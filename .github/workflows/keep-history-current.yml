name: Keep history current

# The live site builds its creator and licence history by scanning contract logs over the public Monad
# RPC, and each page view advances that scan only so far before the RPC's rate limit stops it. Loading
# the marketplace every 10 minutes keeps the scan ahead of the chain. No secrets.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-history-current
  cancel-in-progress: false

jobs:
  ping:
    name: GET /market
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Load https://www.likeness.site/market
        run: |
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 https://www.likeness.site/market || true)
            echo "attempt $attempt: HTTP ${code:-none}"
            if [ "$code" = "200" ]; then exit 0; fi
            [ "$attempt" = 1 ] && sleep 15
          done
          # One missed ping is harmless (the next one catches up), so warn instead of failing the job.
          echo "::warning::/market did not return 200 after two attempts (last: HTTP ${code:-none})"
